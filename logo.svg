<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10151d"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="wheat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3ba6a"/>
      <stop offset="100%" stop-color="#b8842a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#232b38" stroke-width="4"/>

  <!-- batang gandum (wheat awn), digambar simetris di tengah -->
  <g transform="translate(256,256)">
    <!-- tangkai -->
    <line x1="0" y1="150" x2="0" y2="-140" stroke="url(#wheat)" stroke-width="14" stroke-linecap="round"/>

    <!-- butir-butir gandum, berpasangan kiri-kanan dari bawah ke atas -->
    <g fill="url(#wheat)">
      <ellipse cx="-34" cy="90"  rx="20" ry="34" transform="rotate(-28 -34 90)"/>
      <ellipse cx="34"  cy="90"  rx="20" ry="34" transform="rotate(28 34 90)"/>

      <ellipse cx="-38" cy="30"  rx="20" ry="34" transform="rotate(-28 -38 30)"/>
      <ellipse cx="38"  cy="30"  rx="20" ry="34" transform="rotate(28 38 30)"/>

      <ellipse cx="-38" cy="-30" rx="20" ry="34" transform="rotate(-28 -38 -30)"/>
      <ellipse cx="38"  cy="-30" rx="20" ry="34" transform="rotate(28 38 -30)"/>

      <ellipse cx="-32" cy="-88" rx="18" ry="30" transform="rotate(-24 -32 -88)"/>
      <ellipse cx="32"  cy="-88" rx="18" ry="30" transform="rotate(24 32 -88)"/>

      <ellipse cx="0" cy="-150" rx="16" ry="28"/>
    </g>
  </g>
</svg>
